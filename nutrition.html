<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RikFit - خۆراک</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{--bg:#07090E;--card:#0E1117;--card2:#161B24;--border:#1E2530;--blue:#0EA5E9;--blue-dim:rgba(14,165,233,0.12);--green:#10B981;--green-dim:rgba(16,185,129,0.12);--purple:#8B5CF6;--orange:#F59E0B;--red:#EF4444;--red-dim:rgba(239,68,68,0.1);--text:#F0F6FC;--text2:#8B949E;--text3:#3D4450;}
    body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;padding-bottom:90px;}
    .glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;}
    .g1{width:300px;height:300px;background:rgba(16,185,129,0.05);top:-80px;left:-80px;}
    .loading-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;}
    .topbar{position:sticky;top:0;z-index:100;background:rgba(7,9,14,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
    .topbar h2{font-size:20px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#fff,var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .topbar p{color:var(--text2);font-size:13px;}
    .api-status{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;}
    .api-ok{background:var(--green-dim);color:var(--green);}
    .api-local{background:rgba(245,158,11,0.1);color:var(--orange);}
    .page{padding:20px;position:relative;z-index:1;}
    .rings-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;margin-bottom:16px;}
    .rings-title{font-size:14px;font-weight:800;color:var(--text2);margin-bottom:16px;}
    .rings-row{display:flex;justify-content:space-around;align-items:center;}
    .ring-item{text-align:center;}
    .ring-item svg{transform:rotate(-90deg);}
    .ring-item .ri-val{font-size:14px;font-weight:800;margin-top:6px;}
    .ring-item .ri-label{font-size:11px;color:var(--text2);}
    .ring-item .ri-goal{font-size:10px;color:var(--text3);}
    .ring-mini-wrap{position:relative;display:inline-block;}
    .ring-mini-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:800;text-align:center;}
    .sec-header{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;}
    .sec-title{font-size:14px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:1px;}
    .btn-add{width:42px;height:42px;border-radius:12px;border:none;background:var(--blue);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(14,165,233,0.3);}
    .meal-group{margin-bottom:16px;}
    .mg-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 14px;background:var(--card2);border-radius:13px;}
    .mg-icon{font-size:20px;}
    .mg-name{font-size:14px;font-weight:700;}
    .mg-cal{margin-right:auto;font-size:13px;color:var(--text2);}
    .meal-item{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;}
    .meal-emoji{font-size:32px;flex-shrink:0;}
    .meal-info{flex:1;}
    .meal-name{font-size:15px;font-weight:700;}
    .meal-sources{font-size:12px;color:var(--text2);margin-top:3px;}
    .meal-macros{display:flex;gap:10px;margin-top:6px;}
    .mm{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:700;}
    .mm-p{background:rgba(14,165,233,0.12);color:var(--blue);}
    .mm-c{background:rgba(245,158,11,0.12);color:var(--orange);}
    .mm-f{background:rgba(16,185,129,0.12);color:var(--green);}
    .meal-cal{text-align:left;flex-shrink:0;}
    .meal-cal-num{font-size:18px;font-weight:900;}
    .meal-cal-lbl{font-size:11px;color:var(--text2);}
    .meal-del{width:30px;height:30px;border-radius:8px;border:none;background:rgba(239,68,68,0.1);color:var(--red);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .empty-meals{text-align:center;padding:40px 20px;background:var(--card);border:1px dashed var(--border);border-radius:20px;}
    .em-icon{font-size:48px;margin-bottom:12px;}
    .empty-meals p{color:var(--text2);font-size:15px;}
    .em-hint{font-size:13px;color:var(--text3);margin-top:6px;}
    /* 3-item nav */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(14,17,23,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 20px 12px;}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--text3);transition:color 0.2s;padding:4px 0;}
    .nav-item.active{color:var(--green);}
    .nav-item.active .nav-icon{filter:drop-shadow(0 0 6px rgba(16,185,129,0.6));}
    .nav-icon{font-size:22px;}
    .nav-label{font-size:11px;font-weight:600;}
    /* Modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:none;flex-direction:column;backdrop-filter:blur(6px);}
    .overlay.open{display:flex;}
    .modal-sheet{background:var(--card);border-radius:24px 24px 0 0;border:1px solid var(--border);border-bottom:none;margin-top:auto;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s ease;}
    .modal-inner{padding:24px 20px 40px;}
    .modal-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 20px;}
    .modal-title{font-size:18px;font-weight:800;margin-bottom:16px;}
    .meal-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .mt-opt{padding:16px;border-radius:14px;border:2px solid var(--border);background:var(--card2);cursor:pointer;text-align:center;transition:all 0.2s;}
    .mt-opt:hover,.mt-opt.selected{border-color:var(--blue);background:var(--blue-dim);}
    .mt-icon{font-size:28px;margin-bottom:6px;}
    .mt-name{font-size:14px;font-weight:700;}
    .search-box{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:13px;padding:13px 16px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;outline:none;direction:rtl;transition:border-color 0.2s;margin-bottom:12px;}
    .search-box:focus{border-color:var(--blue);}
    .search-box::placeholder{color:var(--text3);}
    .food-list{max-height:260px;overflow-y:auto;}
    .food-item{padding:12px 14px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background 0.15s;border-bottom:1px solid var(--border);}
    .food-item:last-child{border-bottom:none;}
    .food-item:hover{background:var(--card2);}
    .food-item.selected{background:var(--blue-dim);}
    .fi-emoji{font-size:24px;flex-shrink:0;}
    .fi-info{flex:1;}
    .fi-name{font-size:14px;font-weight:700;}
    .fi-name-ku{font-size:12px;color:var(--text2);}
    .fi-cal{font-size:13px;color:var(--blue);font-weight:700;}
    .fi-macros{font-size:11px;color:var(--text3);margin-top:2px;}
    .qty-section{margin-top:12px;}
    .qty-label{font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:600;}
    .qty-wrap{display:flex;align-items:center;background:var(--card2);border:1.5px solid var(--border);border-radius:13px;overflow:hidden;}
    .qty-wrap input{border:none;background:transparent;text-align:center;font-size:22px;font-weight:800;flex:1;padding:14px 6px;color:var(--text);font-family:'Tajawal',sans-serif;outline:none;}
    .qb{width:52px;min-height:54px;background:transparent;border:none;color:var(--blue);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Tajawal',sans-serif;}
    .qty-unit{padding:0 14px;color:var(--text2);font-size:13px;font-weight:600;}
    .qty-preview{margin-top:10px;padding:12px 14px;background:var(--card2);border-radius:11px;display:flex;justify-content:space-between;font-size:13px;}
    .qp-label{color:var(--text2);}
    .qp-val{font-weight:800;color:var(--green);}
    .modal-nav{display:flex;gap:10px;margin-top:16px;}
    .btn-back{flex:0;padding:14px 20px;border-radius:13px;border:1.5px solid var(--border);background:transparent;color:var(--text2);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer;}
    .btn-confirm{flex:1;padding:14px;border-radius:13px;border:none;background:linear-gradient(135deg,var(--green),#059669);color:#fff;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:800;cursor:pointer;}
    @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <div class="loading-screen" id="loading-screen"><div class="spinner"></div></div>
  <div class="glow g1"></div>
  <div class="topbar">
    <div><h2>خۆراک 🍽️</h2><p id="date-txt"></p></div>
    <span class="api-status api-local" id="api-badge">📱 لۆکاڵ</span>
  </div>
  <div class="page">
    <div class="rings-card">
      <div class="rings-title">پیشرفتی ئیمڕۆ</div>
      <div class="rings-row">
        <div class="ring-item"><div class="ring-mini-wrap"><svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="32" fill="none" stroke="#1E2530" stroke-width="7"/><circle id="r-cal" cx="40" cy="40" r="32" fill="none" stroke="var(--blue)" stroke-width="7" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201" style="transition:stroke-dashoffset 1s ease"/></svg><div class="ring-mini-center" id="rc-cal">0%</div></div><div class="ri-val" id="rv-cal">0</div><div class="ri-label">کالۆری</div><div class="ri-goal" id="rg-cal">/ 0</div></div>
        <div class="ring-item"><div class="ring-mini-wrap"><svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="32" fill="none" stroke="#1E2530" stroke-width="7"/><circle id="r-pro" cx="40" cy="40" r="32" fill="none" stroke="var(--blue)" stroke-width="7" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201" style="transition:stroke-dashoffset 1s ease"/></svg><div class="ring-mini-center" id="rc-pro">0%</div></div><div class="ri-val" id="rv-pro">0g</div><div class="ri-label">پڕۆتین</div><div class="ri-goal" id="rg-pro">/ 0g</div></div>
        <div class="ring-item"><div class="ring-mini-wrap"><svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="32" fill="none" stroke="#1E2530" stroke-width="7"/><circle id="r-carb" cx="40" cy="40" r="32" fill="none" stroke="var(--orange)" stroke-width="7" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201" style="transition:stroke-dashoffset 1s ease"/></svg><div class="ring-mini-center" id="rc-carb">0%</div></div><div class="ri-val" id="rv-carb">0g</div><div class="ri-label">کاربۆ</div><div class="ri-goal" id="rg-carb">/ 0g</div></div>
        <div class="ring-item"><div class="ring-mini-wrap"><svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="32" fill="none" stroke="#1E2530" stroke-width="7"/><circle id="r-fat" cx="40" cy="40" r="32" fill="none" stroke="var(--green)" stroke-width="7" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201" style="transition:stroke-dashoffset 1s ease"/></svg><div class="ring-mini-center" id="rc-fat">0%</div></div><div class="ri-val" id="rv-fat">0g</div><div class="ri-label">چەوی</div><div class="ri-goal" id="rg-fat">/ 0g</div></div>
      </div>
    </div>
    <div class="sec-header"><div class="sec-title">🍽️ خواردنەکان</div><button class="btn-add" onclick="openModal()">+</button></div>
    <div id="meals-container"></div>
  </div>

  <!-- 3-item nav -->
  <nav class="bottom-nav">
    <a href="home.html"      class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">ماڵ</span></a>
    <a href="nutrition.html" class="nav-item active"><span class="nav-icon">🍽️</span><span class="nav-label">خۆراک</span></a>
    <a href="vitamins.html"  class="nav-item"><span class="nav-icon">💊</span><span class="nav-label">ڤیتامین</span></a>
  </nav>

  <!-- Modal -->
  <div class="overlay" id="add-modal">
    <div class="modal-sheet"><div class="modal-inner">
      <div class="modal-handle"></div>
      <div id="modal-step-1">
        <div class="modal-title">جۆری خواردن هەڵبژێرە 🍴</div>
        <div class="meal-type-grid">
          <div class="mt-opt" data-type="breakfast" onclick="selMealType('breakfast')"><div class="mt-icon">🌅</div><div class="mt-name">بەیانی خواردن</div></div>
          <div class="mt-opt" data-type="lunch"     onclick="selMealType('lunch')"><div class="mt-icon">☀️</div><div class="mt-name">نیوەڕۆ خواردن</div></div>
          <div class="mt-opt" data-type="dinner"    onclick="selMealType('dinner')"><div class="mt-icon">🌙</div><div class="mt-name">شەو خواردن</div></div>
          <div class="mt-opt" data-type="snack"     onclick="selMealType('snack')"><div class="mt-icon">🍎</div><div class="mt-name">میوە / قۆناغ</div></div>
        </div>
      </div>
      <div id="modal-step-2" style="display:none">
        <div class="modal-title">خواردن بگەڕێ 🔍</div>
        <input type="text" class="search-box" id="food-search" placeholder="ناوی خواردن بنووسە..." oninput="filterFoods(this.value)">
        <div class="food-list" id="food-list"></div>
        <div class="qty-section" id="qty-section" style="display:none">
          <div class="qty-label">چەندیش؟ (گرام)</div>
          <div class="qty-wrap"><button class="qb" onclick="adjQty(-25)">−</button><input type="number" id="qty-inp" value="100" min="1" max="2000" oninput="updateQtyPreview()"><span class="qty-unit">گرام</span><button class="qb" onclick="adjQty(25)">+</button></div>
          <div class="qty-preview"><span class="qp-label">کالۆری:</span><span class="qp-val" id="qty-cal-preview">— cal</span></div>
        </div>
        <div class="modal-nav">
          <button class="btn-back" onclick="backStep1()">← گەڕانەوە</button>
          <button class="btn-confirm" id="btn-confirm-add" onclick="addMeal()" disabled style="opacity:0.5">زیادکردن ✓</button>
        </div>
      </div>
    </div></div>
  </div>

  <script type="module">
    import { initializeApp }               from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    const app=initializeApp({apiKey:"AIzaSyBhYiFcQeB2r6CWDiFvqV0LUPNVoow1sjM",authDomain:"appmass-f26bd.firebaseapp.com",projectId:"appmass-f26bd",storageBucket:"appmass-f26bd.firebasestorage.app",messagingSenderId:"735578268323",appId:"1:735578268323:web:4f5e27ce1307db429bd516"});
    const auth=getAuth(app);
    const FOOD_API_URL='https://your-panel-domain.com/api/foods';
    const DEFAULT_FOODS=[
      {id:'f1',name:'Chicken Breast',name_ku:'سینەی مریشک',emoji:'🍗',cal100:165,pro100:31,carb100:0,fat100:3.6},
      {id:'f2',name:'White Rice',name_ku:'برنجی سپی',emoji:'🍚',cal100:130,pro100:2.7,carb100:28,fat100:0.3},
      {id:'f3',name:'Egg',name_ku:'هێلکە',emoji:'🥚',cal100:155,pro100:13,carb100:1.1,fat100:11},
      {id:'f4',name:'Oats',name_ku:'جۆگرت',emoji:'🌾',cal100:389,pro100:17,carb100:66,fat100:7},
      {id:'f5',name:'Salmon',name_ku:'ماسی سالمۆن',emoji:'🐟',cal100:208,pro100:20,carb100:0,fat100:13},
      {id:'f6',name:'Banana',name_ku:'موز',emoji:'🍌',cal100:89,pro100:1.1,carb100:23,fat100:0.3},
      {id:'f7',name:'Apple',name_ku:'سێو',emoji:'🍎',cal100:52,pro100:0.3,carb100:14,fat100:0.2},
      {id:'f8',name:'Greek Yogurt',name_ku:'ماست یۆنانی',emoji:'🥛',cal100:59,pro100:10,carb100:3.6,fat100:0.4},
      {id:'f9',name:'Almond Butter',name_ku:'ڕووغەنی بادام',emoji:'🥜',cal100:614,pro100:21,carb100:19,fat100:56},
      {id:'f10',name:'Broccoli',name_ku:'بڕۆکۆلی',emoji:'🥦',cal100:34,pro100:2.8,carb100:7,fat100:0.4},
      {id:'f11',name:'Sweet Potato',name_ku:'قەرپووجی شیرین',emoji:'🍠',cal100:86,pro100:1.6,carb100:20,fat100:0.1},
      {id:'f12',name:'Avocado',name_ku:'ئاڤۆکادۆ',emoji:'🥑',cal100:160,pro100:2,carb100:9,fat100:15},
      {id:'f13',name:'Ground Beef',name_ku:'گۆشتی مانگا',emoji:'🥩',cal100:215,pro100:26,carb100:0,fat100:12},
      {id:'f14',name:'Whole Wheat Bread',name_ku:'نانی گەنمی تەواو',emoji:'🍞',cal100:247,pro100:13,carb100:41,fat100:4},
      {id:'f15',name:'Milk',name_ku:'شیر',emoji:'🥛',cal100:61,pro100:3.2,carb100:4.8,fat100:3.3},
      {id:'f16',name:'Tuna',name_ku:'ماسی تونا',emoji:'🐠',cal100:116,pro100:26,carb100:0,fat100:1},
      {id:'f17',name:'Lentils',name_ku:'نووک',emoji:'🫘',cal100:116,pro100:9,carb100:20,fat100:0.4},
      {id:'f18',name:'Orange',name_ku:'پرتەقاڵ',emoji:'🍊',cal100:47,pro100:0.9,carb100:12,fat100:0.1},
      {id:'f19',name:'Olive Oil',name_ku:'ڕووغەنی زەیتوون',emoji:'🫒',cal100:884,pro100:0,carb100:0,fat100:100},
      {id:'f20',name:'Pasta',name_ku:'پاستا',emoji:'🍝',cal100:131,pro100:5,carb100:25,fat100:1.1},
    ];
    let allFoods=[],filteredFoods=[],selectedFood=null,selectedMealType=null;
    onAuthStateChanged(auth,user=>{
      if(!user){window.location.href='index.html';return;}
      document.getElementById('loading-screen').style.display='none';
      checkReset();
      document.getElementById('date-txt').textContent=new Date().toLocaleDateString('en-GB');
      loadFoods();
    });
    function checkReset(){const ts=todayStr(),td=JSON.parse(localStorage.getItem('rkf_today')||'{}');if(td.date!==ts)localStorage.setItem('rkf_today',JSON.stringify({date:ts,water:0,sleep:7.5,sleepQ:'good',meals:[],workouts:[]}));}
    async function loadFoods(){
      try{const r=await fetch(FOOD_API_URL,{signal:AbortSignal.timeout(3000)});if(r.ok){const d=await r.json();allFoods=(d.foods||d).map(f=>({id:f.id,name:f.name,name_ku:f.name_ku||f.name,emoji:f.emoji||'🍽️',cal100:f.calories_per_100g||f.cal100,pro100:f.protein_per_100g||f.pro100,carb100:f.carbs_per_100g||f.carb100,fat100:f.fat_per_100g||f.fat100}));localStorage.setItem('rkf_foods_cache',JSON.stringify(allFoods));document.getElementById('api-badge').className='api-status api-ok';document.getElementById('api-badge').textContent='🌐 ئۆنلاین';}else throw new Error();}catch{const c=localStorage.getItem('rkf_foods_cache');allFoods=c?JSON.parse(c):DEFAULT_FOODS;}
      filteredFoods=[...allFoods];updateRings();renderMeals();
    }
    function updateRings(){
      const prof=JSON.parse(localStorage.getItem('rkf_profile')||'{}'),goals=prof.goals||{calories:2000,protein:120,carbs:250,fat:60};
      const today=JSON.parse(localStorage.getItem('rkf_today')||'{}'),meals=today.meals||[];
      const t={cal:meals.reduce((s,m)=>s+(m.calories||0),0),pro:meals.reduce((s,m)=>s+(m.protein||0),0),carb:meals.reduce((s,m)=>s+(m.carbs||0),0),fat:meals.reduce((s,m)=>s+(m.fat||0),0)};
      const circ=2*Math.PI*32;
      function sR(id,rId,val,goal,lbl){const p=Math.min(1,val/goal);document.getElementById(rId).style.strokeDashoffset=circ*(1-p);document.getElementById('rc-'+id).textContent=Math.round(p*100)+'%';document.getElementById('rv-'+id).textContent=val+(lbl||'');document.getElementById('rg-'+id).textContent='/ '+goal+(lbl||'');}
      sR('cal','r-cal',t.cal,goals.calories,'');sR('pro','r-pro',t.pro,goals.protein,'g');sR('carb','r-carb',t.carb,goals.carbs,'g');sR('fat','r-fat',t.fat,goals.fat,'g');
    }
    function renderMeals(){
      const today=JSON.parse(localStorage.getItem('rkf_today')||'{}'),meals=today.meals||[];
      const cont=document.getElementById('meals-container');
      if(!meals.length){cont.innerHTML='<div class="empty-meals"><div class="em-icon">🍽️</div><p>هێشتا خواردنت تۆمار نەکراوە</p><div class="em-hint">بە کلیک کردن لە + خواردنت زیاد بکە</div></div>';return;}
      const grps={breakfast:{name:'بەیانی خواردن',icon:'🌅',meals:[]},lunch:{name:'نیوەڕۆ خواردن',icon:'☀️',meals:[]},dinner:{name:'شەو خواردن',icon:'🌙',meals:[]},snack:{name:'قۆناغ',icon:'🍎',meals:[]}};
      meals.forEach(m=>{if(grps[m.type])grps[m.type].meals.push(m);});
      let html='';
      for(const[k,g]of Object.entries(grps)){if(!g.meals.length)continue;const gC=g.meals.reduce((s,m)=>s+(m.calories||0),0);html+=`<div class="meal-group"><div class="mg-header"><span class="mg-icon">${g.icon}</span><span class="mg-name">${g.name}</span><span class="mg-cal">${gC} cal</span></div>`;g.meals.forEach(m=>{html+=`<div class="meal-item"><div class="meal-emoji">${m.emoji||'🍽️'}</div><div class="meal-info"><div class="meal-name">${m.name_ku||m.name}</div><div class="meal-sources">${m.qty}g • ${m.name}</div><div class="meal-macros"><span class="mm mm-p">P:${m.protein}g</span><span class="mm mm-c">C:${m.carbs}g</span><span class="mm mm-f">F:${m.fat}g</span></div></div><div class="meal-cal"><div class="meal-cal-num">${m.calories}</div><div class="meal-cal-lbl">cal</div></div><button class="meal-del" onclick="deleteMeal('${m.id}')">×</button></div>`;});html+='</div>';}
      cont.innerHTML=html;
    }
    window.deleteMeal=id=>{const td=JSON.parse(localStorage.getItem('rkf_today')||'{}');td.meals=(td.meals||[]).filter(m=>m.id!==id);localStorage.setItem('rkf_today',JSON.stringify(td));updateRings();renderMeals();};
    window.openModal=()=>{selectedFood=null;selectedMealType=null;document.getElementById('modal-step-1').style.display='block';document.getElementById('modal-step-2').style.display='none';document.querySelectorAll('.mt-opt').forEach(el=>el.classList.remove('selected'));document.getElementById('add-modal').classList.add('open');};
    document.getElementById('add-modal').addEventListener('click',e=>{if(e.target===document.getElementById('add-modal'))document.getElementById('add-modal').classList.remove('open');});
    window.selMealType=type=>{selectedMealType=type;document.querySelectorAll('.mt-opt').forEach(el=>el.classList.toggle('selected',el.dataset.type===type));setTimeout(()=>{document.getElementById('modal-step-1').style.display='none';document.getElementById('modal-step-2').style.display='block';document.getElementById('food-search').value='';filteredFoods=[...allFoods];renderFoodList();document.getElementById('food-search').focus();},200);};
    window.backStep1=()=>{document.getElementById('modal-step-2').style.display='none';document.getElementById('modal-step-1').style.display='block';selectedFood=null;document.getElementById('qty-section').style.display='none';const b=document.getElementById('btn-confirm-add');b.disabled=true;b.style.opacity='0.5';};
    window.filterFoods=q=>{q=q.toLowerCase();filteredFoods=allFoods.filter(f=>f.name.toLowerCase().includes(q)||(f.name_ku&&f.name_ku.includes(q)));renderFoodList();};
    function renderFoodList(){const list=document.getElementById('food-list');if(!filteredFoods.length){list.innerHTML='<div style="text-align:center;padding:20px;color:var(--text2)">خواردنێک نەدۆزرایەوە</div>';return;}list.innerHTML=filteredFoods.map(f=>`<div class="food-item${selectedFood?.id===f.id?' selected':''}" onclick="selectFood('${f.id}')"><span class="fi-emoji">${f.emoji}</span><div class="fi-info"><div class="fi-name">${f.name_ku||f.name}</div><div class="fi-name-ku">${f.name}</div><div class="fi-macros">P:${f.pro100}g C:${f.carb100}g F:${f.fat100}g</div></div><div class="fi-cal">${f.cal100} cal</div></div>`).join('');}
    window.selectFood=id=>{selectedFood=allFoods.find(f=>f.id===id);document.querySelectorAll('.food-item').forEach(el=>el.classList.remove('selected'));event.currentTarget.classList.add('selected');document.getElementById('qty-section').style.display='block';const b=document.getElementById('btn-confirm-add');b.disabled=false;b.style.opacity='1';updateQtyPreview();};
    window.adjQty=d=>{const inp=document.getElementById('qty-inp');inp.value=Math.max(1,Math.min(2000,parseInt(inp.value)+d));updateQtyPreview();};
    window.updateQtyPreview=()=>{if(!selectedFood)return;const qty=parseInt(document.getElementById('qty-inp').value)||100;document.getElementById('qty-cal-preview').textContent=Math.round((selectedFood.cal100/100)*qty)+' cal';};
    window.addMeal=()=>{if(!selectedFood||!selectedMealType)return;const qty=parseInt(document.getElementById('qty-inp').value)||100,r=qty/100;const meal={id:Date.now().toString(),type:selectedMealType,name:selectedFood.name,name_ku:selectedFood.name_ku||selectedFood.name,emoji:selectedFood.emoji,qty,calories:Math.round(selectedFood.cal100*r),protein:Math.round(selectedFood.pro100*r*10)/10,carbs:Math.round(selectedFood.carb100*r*10)/10,fat:Math.round(selectedFood.fat100*r*10)/10,addedAt:new Date().toISOString()};const td=JSON.parse(localStorage.getItem('rkf_today')||'{}');td.meals=td.meals||[];td.meals.push(meal);localStorage.setItem('rkf_today',JSON.stringify(td));document.getElementById('add-modal').classList.remove('open');updateRings();renderMeals();selectedFood=null;document.getElementById('qty-section').style.display='none';document.getElementById('btn-confirm-add').disabled=true;};
    function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  </script>
</body>
</html>
