<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RikFit - خۆراک</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{--bg:#07090E;--card:#0E1117;--card2:#161B24;--border:#1E2530;--blue:#0EA5E9;--blue-dim:rgba(14,165,233,0.12);--green:#10B981;--green-dim:rgba(16,185,129,0.12);--purple:#8B5CF6;--orange:#F59E0B;--red:#EF4444;--red-dim:rgba(239,68,68,0.1);--text:#F0F6FC;--text2:#8B949E;--text3:#3D4450;}
    body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;padding-bottom:90px;}
    .glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;}
    .g1{width:300px;height:300px;background:rgba(16,185,129,0.05);top:-80px;left:-80px;}
    .loading-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;}

    /* TOP BAR */
    .topbar{position:sticky;top:0;z-index:100;background:rgba(7,9,14,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
    .topbar h2{font-size:20px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#fff,var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .topbar p{color:var(--text2);font-size:13px;}
    .live-badge{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--green);background:var(--green-dim);padding:4px 10px;border-radius:20px;}
    .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}

    /* PAGE */
    .page{padding:20px;position:relative;z-index:1;}

    /* RINGS */
    .rings-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;margin-bottom:16px;}
    .rings-title{font-size:14px;font-weight:800;color:var(--text2);margin-bottom:16px;}
    .rings-row{display:flex;justify-content:space-around;align-items:center;}
    .ring-item{text-align:center;}
    .ring-item svg{transform:rotate(-90deg);}
    .ri-val{font-size:14px;font-weight:800;margin-top:6px;}
    .ri-label{font-size:11px;color:var(--text2);}
    .ri-goal{font-size:10px;color:var(--text3);}
    /* Over-limit red */
    .ri-val.over{color:var(--red)!important;}
    .ring-mini-wrap{position:relative;display:inline-block;}
    .ring-mini-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;font-weight:800;text-align:center;line-height:1.2;}

    /* OVERFLOW WARNING */
    .overflow-warning{display:none;background:var(--red-dim);border:1px solid rgba(239,68,68,0.3);border-radius:16px;padding:14px 16px;margin-bottom:14px;}
    .ow-title{font-size:14px;font-weight:800;color:var(--red);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
    .ow-items{display:flex;flex-direction:column;gap:6px;}
    .ow-item{display:flex;justify-content:space-between;font-size:13px;}
    .ow-label{color:var(--text2);}
    .ow-val{color:var(--red);font-weight:800;}

    /* MEALS */
    .sec-header{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;}
    .sec-title{font-size:14px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:1px;}
    .btn-add{width:44px;height:44px;border-radius:13px;border:none;background:var(--blue);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(14,165,233,0.3);}
    .meal-group{margin-bottom:16px;}
    .mg-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 14px;background:var(--card2);border-radius:13px;}
    .mg-icon{font-size:20px;}
    .mg-name{font-size:14px;font-weight:700;}
    .mg-cal{margin-right:auto;font-size:13px;color:var(--text2);}
    .meal-item{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.2s;}
    .meal-item:hover{border-color:var(--blue);}
    .meal-emoji{font-size:32px;flex-shrink:0;}
    .meal-info{flex:1;}
    .meal-name{font-size:15px;font-weight:700;}
    .meal-sources{font-size:12px;color:var(--text2);margin-top:3px;}
    .meal-macros{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
    .mm{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:700;}
    .mm-p{background:rgba(14,165,233,0.12);color:var(--blue);}
    .mm-c{background:rgba(245,158,11,0.12);color:var(--orange);}
    .mm-f{background:rgba(16,185,129,0.12);color:var(--green);}
    .meal-cal{text-align:left;flex-shrink:0;}
    .meal-cal-num{font-size:18px;font-weight:900;}
    .meal-cal-lbl{font-size:11px;color:var(--text2);}
    .meal-del{width:32px;height:32px;border-radius:8px;border:none;background:rgba(239,68,68,0.1);color:var(--red);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    
    /* MEAL DETAILS (expandable) */
    .meal-details{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
    .meal-details.open{display:block;}
    .meal-det-title{font-size:12px;font-weight:800;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;}
    .micro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
    .micro-item{background:var(--card2);padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;}
    .micro-name{font-size:11px;color:var(--text2);}
    .micro-val{font-size:12px;font-weight:700;color:var(--purple);}
    
    .empty-meals{text-align:center;padding:40px 20px;background:var(--card);border:1px dashed var(--border);border-radius:20px;}
    .em-icon{font-size:48px;margin-bottom:12px;}
    .empty-meals p{color:var(--text2);font-size:15px;}
    .em-hint{font-size:13px;color:var(--text3);margin-top:6px;}

    /* BOTTOM NAV */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(14,17,23,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 20px 12px;}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--text3);transition:color 0.2s;padding:4px 0;}
    .nav-item.active{color:var(--green);}
    .nav-item.active .nav-icon{filter:drop-shadow(0 0 6px rgba(16,185,129,0.6));}
    .nav-icon{font-size:22px;}
    .nav-label{font-size:11px;font-weight:600;}

    /* MODAL */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:none;flex-direction:column;backdrop-filter:blur(6px);}
    .overlay.open{display:flex;}
    .modal-sheet{background:var(--card);border-radius:24px 24px 0 0;border:1px solid var(--border);border-bottom:none;margin-top:auto;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s ease;}
    .modal-inner{padding:20px 20px 40px;}
    .modal-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 18px;}
    .modal-title{font-size:18px;font-weight:800;margin-bottom:16px;}

    /* Step 1: meal type */
    .meal-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .mt-opt{padding:18px 14px;border-radius:14px;border:2px solid var(--border);background:var(--card2);cursor:pointer;text-align:center;transition:all 0.2s;}
    .mt-opt:hover,.mt-opt.selected{border-color:var(--blue);background:var(--blue-dim);}
    .mt-icon{font-size:30px;margin-bottom:8px;}
    .mt-name{font-size:14px;font-weight:700;}

    /* Step 2: search + list */
    .search-row{display:flex;gap:10px;margin-bottom:10px;align-items:center;}
    .search-box{flex:1;background:var(--card2);border:1.5px solid var(--border);border-radius:13px;padding:13px 16px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;outline:none;direction:rtl;transition:border-color 0.2s;}
    .search-box:focus{border-color:var(--blue);}
    .search-box::placeholder{color:var(--text3);}
    /* Category tabs */
    .cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none;}
    .cat-tabs::-webkit-scrollbar{display:none;}
    .cat-tab{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card2);color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Tajawal',sans-serif;transition:all 0.2s;flex-shrink:0;}
    .cat-tab.active{border-color:var(--blue);background:var(--blue-dim);color:var(--blue);}
    /* ★ BIGGER FOOD LIST */
    .food-list{max-height:320px;overflow-y:auto;border-radius:13px;border:1px solid var(--border);}
    .food-item{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:background 0.15s;border-bottom:1px solid var(--border);}
    .food-item:last-child{border-bottom:none;}
    .food-item:hover{background:var(--card2);}
    .food-item.selected{background:var(--blue-dim);}
    .fi-emoji{font-size:28px;flex-shrink:0;}
    .fi-info{flex:1;}
    .fi-name{font-size:15px;font-weight:700;}
    .fi-name-en{font-size:12px;color:var(--text2);}
    .fi-units{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
    .fi-unit-badge{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--card);border:1px solid var(--border);color:var(--text2);}
    .empty-food{text-align:center;padding:30px;color:var(--text2);font-size:14px;}
    .loading-foods{text-align:center;padding:20px;color:var(--text2);font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;}
    .mini-spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.6s linear infinite;}

    /* Step 3: qty + unit */
    .s3-title{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
    .unit-selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
    .unit-opt{padding:9px 16px;border-radius:10px;border:2px solid var(--border);background:var(--card2);cursor:pointer;font-size:13px;font-weight:700;color:var(--text2);transition:all 0.2s;font-family:'Tajawal',sans-serif;}
    .unit-opt.sel{border-color:var(--green);background:var(--green-dim);color:var(--green);}
    .qty-label{font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:600;}
    .qty-wrap{display:flex;align-items:center;background:var(--card2);border:1.5px solid var(--border);border-radius:13px;overflow:hidden;margin-bottom:10px;}
    .qty-wrap input{border:none;background:transparent;text-align:center;font-size:24px;font-weight:800;flex:1;padding:15px 6px;color:var(--text);font-family:'Tajawal',sans-serif;outline:none;}
    .qty-wrap button{border:none;background:transparent;color:var(--text2);font-size:24px;padding:0 16px;cursor:pointer;transition:color 0.2s;}
    .qty-wrap button:hover{color:var(--text);}
    .qty-unit{font-size:13px;color:var(--text2);padding-left:14px;}
    .cal-preview{text-align:center;font-size:14px;color:var(--text2);margin-bottom:14px;}
    .cal-preview span{font-size:22px;font-weight:900;color:var(--green);display:block;margin-bottom:4px;}
    .btn-confirm{width:100%;padding:16px;border-radius:14px;border:none;background:var(--green);color:#fff;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(16,185,129,0.3);transition:all 0.2s;}
    .btn-confirm:active{transform:scale(0.98);}
    .btn-back{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--border);background:transparent;color:var(--text2);font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px;}

    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
    @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}

    .modal-step{display:none;}
    .modal-step.active{display:block;}
  </style>
</head>
<body>
  <div class="loading-screen" id="loading-screen"><div class="spinner"></div></div>
  <div class="glow g1"></div>

  <!-- TOP BAR -->
  <div class="topbar">
    <div>
      <h2>RikFit</h2>
      <p id="today-date"></p>
    </div>
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
  </div>

  <!-- PAGE -->
  <div class="page">
    <!-- RINGS -->
    <div class="rings-card">
      <div class="rings-title">ماکرۆکان</div>
      <div class="rings-row" id="rings-row"></div>
    </div>

    <!-- OVERFLOW WARNING -->
    <div class="overflow-warning" id="overflow-warning">
      <div class="ow-title">⚠️ تێپەڕیوی لە ئامانجەکان</div>
      <div class="ow-items" id="overflow-items"></div>
    </div>

    <!-- MEALS BY TYPE -->
    <div class="sec-header">
      <div class="sec-title">خواردنەکانی ئەمڕۆ</div>
      <button class="btn-add" onclick="openAddModal()">+</button>
    </div>
    <div id="meals-container"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="nutrition.html" class="nav-item active">
      <span class="nav-icon">🍽️</span>
      <span class="nav-label">خۆراک</span>
    </a>
    <a href="vitamins.html" class="nav-item">
      <span class="nav-icon">💊</span>
      <span class="nav-label">ڤیتامین</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span class="nav-label">پرۆفایل</span>
    </a>
  </nav>

  <!-- ADD MEAL MODAL -->
  <div class="overlay" id="add-modal">
    <div class="modal-sheet">
      <div class="modal-inner">
        <div class="modal-handle"></div>
        
        <!-- Step 1: Select meal type -->
        <div class="modal-step active" id="step-1">
          <div class="modal-title">جۆری خواردن هەڵبژێرە</div>
          <div class="meal-type-grid">
            <div class="mt-opt" onclick="selMealType('breakfast')">
              <div class="mt-icon">🌅</div>
              <div class="mt-name">بەیانی</div>
            </div>
            <div class="mt-opt" onclick="selMealType('lunch')">
              <div class="mt-icon">☀️</div>
              <div class="mt-name">نیوەڕۆ</div>
            </div>
            <div class="mt-opt" onclick="selMealType('dinner')">
              <div class="mt-icon">🌙</div>
              <div class="mt-name">ئێوارە</div>
            </div>
            <div class="mt-opt" onclick="selMealType('snack')">
              <div class="mt-icon">🍪</div>
              <div class="mt-name">خواردنی سووک</div>
            </div>
          </div>
        </div>

        <!-- Step 2: Search & select food -->
        <div class="modal-step" id="step-2">
          <div class="modal-title">خواردنێک هەڵبژێرە</div>
          <div class="search-row">
            <input type="text" id="food-search" class="search-box" placeholder="گەڕان..." oninput="filterFoods(this.value)" readonly onfocus="this.removeAttribute('readonly')">
          </div>
          <div class="cat-tabs">
            <button class="cat-tab active" data-cat="all" onclick="selCat('all')">هەموو</button>
            <button class="cat-tab" data-cat="پرۆتین" onclick="selCat('پرۆتین')">پرۆتین</button>
            <button class="cat-tab" data-cat="کاربۆهایدرێت" onclick="selCat('کاربۆهایدرێت')">کاربۆ</button>
            <button class="cat-tab" data-cat="میوە" onclick="selCat('میوە')">میوە</button>
            <button class="cat-tab" data-cat="سەوزە" onclick="selCat('سەوزە')">سەوزە</button>
            <button class="cat-tab" data-cat="شیرەمەنی" onclick="selCat('شیرەمەنی')">شیرەمەنی</button>
          </div>
          <div class="food-list" id="food-list"></div>
          <button class="btn-back" onclick="backToS1()">گەڕانەوە</button>
        </div>

        <!-- Step 3: Set quantity -->
        <div class="modal-step" id="step-3">
          <div class="s3-title">
            <span id="s3-emoji"></span>
            <div>
              <div id="s3-name"></div>
              <div style="font-size:13px;color:var(--text2);font-weight:400;" id="s3-name-en"></div>
            </div>
          </div>
          <div id="unit-sel-wrap">
            <div class="qty-label">یەکە هەڵبژێرە</div>
            <div class="unit-selector" id="unit-selector"></div>
          </div>
          <div class="qty-label" id="qty-label-txt">چەند دانە؟</div>
          <div class="qty-wrap">
            <button onclick="adjQty(-1)">−</button>
            <input type="number" id="qty-inp" value="1" step="1" min="0.1" oninput="updatePreview()">
            <span class="qty-unit" id="qty-unit-lbl">دانە</span>
            <button onclick="adjQty(1)">+</button>
          </div>
          <div class="cal-preview">
            <span id="qty-cal-preview">0 cal</span>
            کالۆری
          </div>
          <button class="btn-confirm" onclick="addMeal()">زیادکردن</button>
          <button class="btn-back" onclick="backToS2()">گەڕانەوە</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import{initializeApp}from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import{getFirestore,collection,getDocs}from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    const app=initializeApp({apiKey:"AIzaSyCpWGLPYMHLEhd6bV0w3PAQ4aLBG0W-2bY",authDomain:"rikfit-d8f42.firebaseapp.com",projectId:"rikfit-d8f42"});
    const db=getFirestore(app);
    window.db=db;
    let allFoods=[],filteredFoods=[],searchQ='',activeCat='all',selectedMealType='',selectedFood=null,selectedUnit=null,foodsLoaded=false;

    async function loadFoods(){
      try{
        const snap=await getDocs(collection(db,'foods'));
        allFoods=snap.docs.map(d=>({id:d.id,...d.data()}));
        filteredFoods=allFoods;
        foodsLoaded=true;
      }catch(e){console.error(e);}
    }
    loadFoods();

    function applyFilter(){
      filteredFoods=allFoods.filter(f=>{
        const matchCat=activeCat==='all'||(f.categories||[]).includes(activeCat);
        const nameKu=(f.name_ku||'').toLowerCase();
        const nameEn=(f.name_en||'').toLowerCase();
        const matchQ=!searchQ||nameKu.includes(searchQ.toLowerCase())||nameEn.includes(searchQ.toLowerCase());
        return matchCat&&matchQ;
      });
    }

    setTimeout(()=>{document.getElementById('loading-screen').style.display='none';},800);
    document.getElementById('today-date').textContent=new Date().toLocaleDateString('ckb-IQ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    updateRings();renderMeals();

    // ═════ GOALS ═════
    function getGoals(){
      const prof=JSON.parse(localStorage.getItem('rkf_profile')||'{}');
      return{
        calories:prof.goal_calories||2000,
        protein:prof.goal_protein||150,
        carbs:prof.goal_carbs||200,
        fat:prof.goal_fat||60
      };
    }

    function updateRings(){
      const td=JSON.parse(localStorage.getItem('rkf_today')||'{}');
      const meals=td.meals||[];
      const totals={calories:0,protein:0,carbs:0,fat:0};
      meals.forEach(m=>{
        totals.calories+=(m.calories||0);
        totals.protein+=(m.protein||0);
        totals.carbs+=(m.carbs||0);
        totals.fat+=(m.fat||0);
      });
      const goals=getGoals();
      const pcts={
        calories:Math.round(totals.calories/goals.calories*100),
        protein:Math.round(totals.protein/goals.protein*100),
        carbs:Math.round(totals.carbs/goals.carbs*100),
        fat:Math.round(totals.fat/goals.fat*100)
      };
      const overflows=[];
      if(pcts.calories>100)overflows.push({label:'کالۆری',val:Math.round(totals.calories)+' / '+goals.calories});
      if(pcts.protein>100)overflows.push({label:'پرۆتین',val:Math.round(totals.protein)+'g / '+goals.protein+'g'});
      if(pcts.carbs>100)overflows.push({label:'کاربۆ',val:Math.round(totals.carbs)+'g / '+goals.carbs+'g'});
      if(pcts.fat>100)overflows.push({label:'چەوری',val:Math.round(totals.fat)+'g / '+goals.fat+'g'});
      if(overflows.length){
        document.getElementById('overflow-warning').style.display='block';
        document.getElementById('overflow-items').innerHTML=overflows.map(o=>`<div class="ow-item"><span class="ow-label">${o.label}</span><span class="ow-val">${o.val}</span></div>`).join('');
      }else{document.getElementById('overflow-warning').style.display='none';}
      const ringHTML=(label,total,goal,color,pct)=>{
        const r=32,circ=2*Math.PI*r,off=circ*(1-Math.min(pct,100)/100);
        const isOver=pct>100;
        return`<div class="ring-item"><div class="ring-mini-wrap"><svg width="80" height="80"><circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--border)" stroke-width="6"/><circle cx="40" cy="40" r="${r}" fill="none" stroke="${isOver?'var(--red)':color}" stroke-width="6" stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round"/></svg><div class="ring-mini-center">${pct}%</div></div><div class="ri-val${isOver?' over':''}" style="color:${color}">${Math.round(total)}</div><div class="ri-label">${label}</div><div class="ri-goal">هدف: ${goal}</div></div>`;
      };
      document.getElementById('rings-row').innerHTML=ringHTML('کالۆری',totals.calories,goals.calories,'var(--green)',pcts.calories)+ringHTML('پرۆتین',totals.protein,goals.protein+'g','var(--blue)',pcts.protein)+ringHTML('کاربۆ',totals.carbs,goals.carbs+'g','var(--orange)',pcts.carbs)+ringHTML('چەوری',totals.fat,goals.fat+'g','var(--green)',pcts.fat);
    }

    function renderMeals(){
      const td=JSON.parse(localStorage.getItem('rkf_today')||'{}');
      const meals=td.meals||[];
      const groups={breakfast:{name:'بەیانی',icon:'🌅',meals:[]},lunch:{name:'نیوەڕۆ',icon:'☀️',meals:[]},dinner:{name:'ئێوارە',icon:'🌙',meals:[]},snack:{name:'خواردنی سووک',icon:'🍪',meals:[]}};
      meals.forEach(m=>groups[m.type]?.meals.push(m));
      const cont=document.getElementById('meals-container');
      if(!meals.length){cont.innerHTML='<div class="empty-meals"><div class="em-icon">🍽️</div><p>هێشتا خواردنێک زیاد نەکراوە</p><div class="em-hint">کرتە بکە لەسەر (+) بۆ زیادکردن</div></div>';return;}
      cont.innerHTML=Object.entries(groups).map(([key,g])=>{
        if(!g.meals.length)return'';
        const totalCal=g.meals.reduce((s,m)=>s+(m.calories||0),0);
        return`<div class="meal-group"><div class="mg-header"><span class="mg-icon">${g.icon}</span><span class="mg-name">${g.name}</span><span class="mg-cal">${Math.round(totalCal)} cal</span></div>${g.meals.map(m=>`<div class="meal-item" onclick="toggleMealDetails('${m.id}')"><span class="meal-emoji">${m.emoji||'🍽️'}</span><div class="meal-info"><div class="meal-name">${m.name_ku||m.name_en||'—'}</div><div class="meal-sources">${m.qty} ${m.unit}</div><div class="meal-macros"><span class="mm mm-p">P: ${Math.round(m.protein||0)}g</span><span class="mm mm-c">C: ${Math.round(m.carbs||0)}g</span><span class="mm mm-f">F: ${Math.round(m.fat||0)}g</span></div><div class="meal-details" id="details-${m.id}"><div class="meal-det-title">ڤیتامین و کانزا</div><div class="micro-grid">${renderMicronutrients(m)}</div></div></div><div class="meal-cal"><div class="meal-cal-num">${Math.round(m.calories||0)}</div><div class="meal-cal-lbl">cal</div></div><button class="meal-del" onclick="delMeal(event,'${m.id}')">×</button></div>`).join('')}</div>`;
      }).join('');
    }
    
    function renderMicronutrients(meal){
      const micros=[];
      if(meal.vitaminA)micros.push({name:'ڤیتامین A',val:Math.round(meal.vitaminA)+'μg'});
      if(meal.vitaminC)micros.push({name:'ڤیتامین C',val:Math.round(meal.vitaminC)+'mg'});
      if(meal.vitaminD)micros.push({name:'ڤیتامین D',val:Math.round(meal.vitaminD)+'μg'});
      if(meal.calcium)micros.push({name:'کالسیۆم',val:Math.round(meal.calcium)+'mg'});
      if(meal.iron)micros.push({name:'ئاسن',val:Math.round(meal.iron)+'mg'});
      if(meal.fiber)micros.push({name:'فایبەر',val:Math.round(meal.fiber)+'g'});
      if(!micros.length)return'<div class="micro-item" style="grid-column:1/-1;text-align:center;color:var(--text3);">زانیاری نییە</div>';
      return micros.map(m=>`<div class="micro-item"><span class="micro-name">${m.name}</span><span class="micro-val">${m.val}</span></div>`).join('');
    }
    
    window.toggleMealDetails=id=>{
      const el=document.getElementById('details-'+id);
      if(!el)return;
      el.classList.toggle('open');
    };

    window.delMeal=(e,id)=>{
      e.stopPropagation();
      const td=JSON.parse(localStorage.getItem('rkf_today')||'{}');
      td.meals=(td.meals||[]).filter(m=>m.id!==id);
      localStorage.setItem('rkf_today',JSON.stringify(td));
      updateRings();renderMeals();
    };

    // ═════ MODAL ═════
    window.openAddModal=()=>{document.getElementById('add-modal').classList.add('open');showStep(1);};
    document.getElementById('add-modal').addEventListener('click',e=>{if(e.target===document.getElementById('add-modal'))document.getElementById('add-modal').classList.remove('open');});

    function showStep(n){
      document.querySelectorAll('.modal-step').forEach((s,i)=>s.classList.toggle('active',i+1===n));
    }

    window.selMealType=type=>{
      selectedMealType=type;
      document.querySelectorAll('.mt-opt').forEach(el=>el.classList.toggle('selected',el.textContent.includes({breakfast:'بەیانی',lunch:'نیوەڕۆ',dinner:'ئێوارە',snack:'سووک'}[type])));
      setTimeout(()=>{
        showStep(2);
        // reset search — readonly so keyboard won't auto-open
        const si=document.getElementById('food-search');
        si.value='';si.setAttribute('readonly','');
        searchQ='';activeCat='all';
        document.querySelectorAll('.cat-tab').forEach(el=>el.classList.toggle('active',el.dataset.cat==='all'));
        applyFilter();renderFoodList();
      },200);
    };

    window.backToS1=()=>showStep(1);
    window.backToS2=()=>{selectedFood=null;selectedUnit=null;showStep(2);renderFoodList();};

    window.selCat=cat=>{
      activeCat=cat;
      document.querySelectorAll('.cat-tab').forEach(el=>el.classList.toggle('active',el.dataset.cat===cat));
      applyFilter();renderFoodList();
    };

    window.filterFoods=q=>{searchQ=q;applyFilter();renderFoodList();};

    function renderFoodList(){
      const list=document.getElementById('food-list');
      if(!foodsLoaded){list.innerHTML='<div class="loading-foods"><div class="mini-spin"></div>بارکردن لە Firestore...</div>';return;}
      if(!filteredFoods.length){
        list.innerHTML=`<div class="empty-food">${allFoods.length===0?'هێشتا خواردنێک زیاد نەکراوە لە ئەدمین':'خواردنێک نەدۆزرایەوە'}</div>`;
        return;
      }
      list.innerHTML=filteredFoods.map(f=>{
        const units=f.units||[];
        const unitBadges=units.map(u=>`<span class="fi-unit-badge">${u.type}</span>`).join('');
        return`<div class="food-item${selectedFood?.id===f.id?' selected':''}" onclick="selectFood('${f.id}')">
          <span class="fi-emoji">${f.emoji||'🍽️'}</span>
          <div class="fi-info">
            <div class="fi-name">${f.name_ku||f.name_en||'—'}</div>
            <div class="fi-name-en">${f.name_en||''}</div>
            <div class="fi-units">${unitBadges}</div>
          </div>
        </div>`;
      }).join('');
    }

    window.selectFood=id=>{
      selectedFood=allFoods.find(f=>f.id===id);
      if(!selectedFood)return;
      const units=selectedFood.units||[];
      selectedUnit=units[0]||null;
      // Unit selector
      const wrap=document.getElementById('unit-sel-wrap');
      const sel=document.getElementById('unit-selector');
      if(units.length>1){
        wrap.style.display='block';
        sel.innerHTML=units.map((u,i)=>`<button class="unit-opt${i===0?' sel':''}" onclick="selUnit(${i})">${u.type}</button>`).join('');
      }else{wrap.style.display='none';}
      document.getElementById('s3-emoji').textContent=selectedFood.emoji||'🍽️';
      document.getElementById('s3-name').textContent=selectedFood.name_ku||selectedFood.name_en||'';
      document.getElementById('s3-name-en').textContent=selectedFood.name_en||'';
      setDefaultQty(selectedUnit);
      showStep(3);
    };

    window.selUnit=idx=>{
      const units=selectedFood?.units||[];
      selectedUnit=units[idx];
      document.querySelectorAll('.unit-opt').forEach((el,i)=>el.classList.toggle('sel',i===idx));
      setDefaultQty(selectedUnit);
    };

    function isPerHundred(unitType){
      if(!unitType)return true;
      return unitType.includes('گرام')||unitType.includes('ملیلیتر')||unitType.includes('g)')||unitType.includes('ml)')||unitType.includes('لیتر')||unitType.includes('kg)')||unitType.includes('L)');
    }

    function setDefaultQty(unit){
      if(!unit)return;
      const def=isPerHundred(unit.type)?100:1;
      const step=isPerHundred(unit.type)?10:1;
      const inp=document.getElementById('qty-inp');
      inp.value=def;inp.step=step;
      document.getElementById('qty-unit-lbl').textContent=unit.type;
      document.getElementById('qty-label-txt').textContent=`چەند ${unit.type}؟`;
      updatePreview();
    }

    window.adjQty=d=>{
      const inp=document.getElementById('qty-inp');
      const step=parseFloat(inp.step)||1;
      let v=parseFloat(inp.value)+d*step;
      inp.value=Math.max(0.1,Math.round(v*10)/10);
      updatePreview();
    };

    window.updatePreview=()=>{
      if(!selectedFood||!selectedUnit)return;
      const qty=parseFloat(document.getElementById('qty-inp').value)||1;
      const cal=calcN(selectedUnit,qty,'cal');
      document.getElementById('qty-cal-preview').textContent=Math.round(cal*10)/10+' cal';
    };

    function calcN(unit,qty,field){
      if(!unit)return 0;
      if(isPerHundred(unit.type))return(unit[field]||0)*(qty/100);
      return(unit[field]||0)*qty;
    }

    window.addMeal=()=>{
      if(!selectedFood||!selectedUnit||!selectedMealType)return;
      const qty=parseFloat(document.getElementById('qty-inp').value)||1;
      const meal={
        id:Date.now().toString(),
        type:selectedMealType,
        name_ku:selectedFood.name_ku||'',
        name_en:selectedFood.name_en||'',
        emoji:selectedFood.emoji||'🍽️',
        qty,unit:selectedUnit.type,
        calories:calcN(selectedUnit,qty,'cal'),
        protein:calcN(selectedUnit,qty,'protein'),
        carbs:calcN(selectedUnit,qty,'carbs'),
        fat:calcN(selectedUnit,qty,'fat'),
        vitaminA:calcN(selectedUnit,qty,'vitaminA'),
        vitaminC:calcN(selectedUnit,qty,'vitaminC'),
        vitaminD:calcN(selectedUnit,qty,'vitaminD'),
        calcium:calcN(selectedUnit,qty,'calcium'),
        iron:calcN(selectedUnit,qty,'iron'),
        fiber:calcN(selectedUnit,qty,'fiber'),
        addedAt:new Date().toISOString()
      };
      const td=JSON.parse(localStorage.getItem('rkf_today')||'{}');
      td.meals=td.meals||[];td.meals.push(meal);
      localStorage.setItem('rkf_today',JSON.stringify(td));
      document.getElementById('add-modal').classList.remove('open');
      updateRings();renderMeals();
      selectedFood=null;selectedUnit=null;
    };

    function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  </script>
</body>
</html>
