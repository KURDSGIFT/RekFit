<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RikFit - ماڵ</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{--bg:#07090E;--card:#0E1117;--card2:#161B24;--border:#1E2530;--blue:#0EA5E9;--blue-dim:rgba(14,165,233,0.12);--green:#10B981;--green-dim:rgba(16,185,129,0.12);--purple:#8B5CF6;--orange:#F59E0B;--red:#EF4444;--text:#F0F6FC;--text2:#8B949E;--text3:#3D4450;}
    body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;padding-bottom:90px;overflow-x:hidden;}
    .glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;}
    .g1{width:350px;height:350px;background:rgba(14,165,233,0.05);top:-100px;right:-100px;}
    .g2{width:250px;height:250px;background:rgba(16,185,129,0.04);bottom:100px;left:-80px;}
    .loading-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}

    /* TOP BAR */
    .topbar{position:sticky;top:0;z-index:100;background:rgba(7,9,14,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
    .topbar-left h2{font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#fff,var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .topbar-left p{color:var(--text2);font-size:13px;margin-top:2px;}
    .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 0 15px rgba(14,165,233,0.3);transition:transform 0.2s;}
    .avatar:hover{transform:scale(1.08);}

    .page{padding:20px;position:relative;z-index:1;}
    .sec-title{font-size:15px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin:20px 0 12px;}

    /* Streak */
    .streak-banner{background:linear-gradient(135deg,rgba(245,158,11,0.1),rgba(239,68,68,0.08));border:1px solid rgba(245,158,11,0.2);border-radius:18px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px;}
    .streak-num{font-size:26px;font-weight:900;color:var(--orange);}
    .streak-label{font-size:13px;color:var(--text2);}

    /* Calorie Ring */
    .calorie-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:24px;margin-bottom:16px;display:flex;align-items:center;gap:24px;}
    .ring-wrap{position:relative;flex-shrink:0;}
    .ring-wrap svg{transform:rotate(-90deg);}
    .ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
    .ring-cal{font-size:22px;font-weight:900;}
    .ring-lbl{font-size:11px;color:var(--text2);margin-top:2px;}
    .calorie-info{flex:1;}
    .ci-row{display:flex;justify-content:space-between;margin-bottom:10px;}
    .ci-val{font-size:18px;font-weight:800;}
    .ci-name{font-size:12px;color:var(--text2);}
    .ci-remaining{background:var(--card2);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;}
    .ci-remaining span{font-size:13px;color:var(--text2);}
    .ci-remaining strong{color:var(--green);font-size:15px;}

    /* Macros */
    .macro-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;}
    .macro-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 14px;text-align:center;}
    .macro-icon{font-size:20px;margin-bottom:6px;}
    .macro-val{font-size:17px;font-weight:800;}
    .macro-name{font-size:11px;color:var(--text2);margin:3px 0 8px;}
    .macro-bar-bg{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;}
    .macro-bar-fill{height:100%;border-radius:3px;transition:width 1s ease;}

    /* Water */
    .water-card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:20px;margin-bottom:16px;}
    .water-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
    .wh-left{display:flex;align-items:center;gap:10px;}
    .wh-title{font-size:16px;font-weight:700;}
    .wh-sub{font-size:12px;color:var(--text2);}
    .water-count{font-size:24px;font-weight:900;color:var(--blue);}
    .water-glasses{display:flex;gap:8px;flex-wrap:wrap;}
    .glass{width:36px;height:36px;border-radius:10px;border:2px solid var(--border);background:var(--card2);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;font-size:18px;}
    .glass.filled{background:var(--blue-dim);border-color:var(--blue);}
    .glass:hover{transform:scale(1.1);}

    /* Sleep */
    .sleep-card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:20px;margin-bottom:16px;}
    .sleep-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
    .sleep-title{font-size:16px;font-weight:700;}
    .sleep-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;}
    .sleep-controls{display:flex;align-items:center;gap:16px;}
    .sleep-val{font-size:32px;font-weight:900;text-align:center;flex:1;}
    .sleep-unit{font-size:14px;color:var(--text2);}
    .sc-btn{width:44px;height:44px;border-radius:12px;border:2px solid var(--border);background:var(--card2);color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .sleep-quality{display:flex;gap:8px;margin-top:12px;}
    .sq-opt{flex:1;padding:8px;border-radius:10px;text-align:center;border:2px solid var(--border);background:var(--card2);cursor:pointer;font-size:12px;font-weight:700;transition:all 0.2s;}
    .sq-opt.selected{border-color:var(--purple);background:rgba(139,92,246,0.12);color:var(--purple);}

    /* Workout */
    .workout-card{background:linear-gradient(135deg,rgba(14,165,233,0.08),rgba(139,92,246,0.08));border:1px solid rgba(14,165,233,0.2);border-radius:22px;padding:20px;margin-bottom:16px;}
    .wc-badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;background:var(--blue-dim);color:var(--blue);margin-bottom:8px;}
    .wc-title{font-size:20px;font-weight:900;margin-bottom:4px;}
    .wc-sub{font-size:13px;color:var(--text2);}
    .wc-stats{display:flex;gap:20px;margin:14px 0;}
    .wc-stat{display:flex;align-items:center;gap:8px;}
    .ws-icon{font-size:18px;}
    .ws-text{font-size:13px;color:var(--text2);}
    .ws-val{font-size:15px;font-weight:700;}
    .btn-start{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--blue),#0077B6);color:#fff;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:800;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 16px rgba(14,165,233,0.3);}
    .btn-start:hover{transform:translateY(-2px);}

    /* Bottom nav - 3 items */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(14,17,23,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 20px 12px;}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--text3);transition:color 0.2s;padding:4px 0;}
    .nav-item.active{color:var(--blue);}
    .nav-item.active .nav-icon{filter:drop-shadow(0 0 6px rgba(14,165,233,0.6));}
    .nav-icon{font-size:22px;}
    .nav-label{font-size:11px;font-weight:600;}

    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <div class="loading-screen" id="loading-screen"><div class="spinner"></div></div>
  <div class="glow g1"></div><div class="glow g2"></div>

  <div class="topbar">
    <div class="topbar-left"><h2>RIKFIT</h2><p id="today-date"></p></div>
    <!-- Avatar click → profile.html -->
    <div class="avatar" id="avatar-el" onclick="window.location.href='profile.html'">?</div>
  </div>

  <div class="page">
    <div class="streak-banner">
      <div style="font-size:36px">🔥</div>
      <div><div class="streak-num" id="streak-num">0</div><div class="streak-label">ڕۆژ دەستنەوەردارێتی</div></div>
    </div>

    <div class="calorie-card">
      <div class="ring-wrap">
        <svg width="110" height="110" viewBox="0 0 110 110">
          <circle cx="55" cy="55" r="45" fill="none" stroke="#1E2530" stroke-width="9"/>
          <circle id="cal-ring" cx="55" cy="55" r="45" fill="none" stroke="var(--blue)" stroke-width="9" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="283" style="transition:stroke-dashoffset 1.2s ease"/>
        </svg>
        <div class="ring-center"><div class="ring-cal" id="cal-consumed">0</div><div class="ring-lbl">cal</div></div>
      </div>
      <div class="calorie-info">
        <div class="ci-row">
          <div><div class="ci-val" style="color:var(--blue)" id="ci-goal">0</div><div class="ci-name">ئامانج</div></div>
          <div><div class="ci-val" style="color:var(--orange)" id="ci-burned">0</div><div class="ci-name">سووتاندراو</div></div>
        </div>
        <div class="ci-remaining"><span>ماوە</span><strong id="ci-left">0 cal</strong></div>
      </div>
    </div>

    <div class="macro-grid">
      <div class="macro-card"><div class="macro-icon">🥩</div><div class="macro-val" id="m-protein">0g</div><div class="macro-name">پڕۆتین</div><div class="macro-bar-bg"><div class="macro-bar-fill" id="bar-protein" style="background:var(--blue);width:0%"></div></div></div>
      <div class="macro-card"><div class="macro-icon">🌾</div><div class="macro-val" id="m-carbs">0g</div><div class="macro-name">کاربۆ</div><div class="macro-bar-bg"><div class="macro-bar-fill" id="bar-carbs" style="background:var(--orange);width:0%"></div></div></div>
      <div class="macro-card"><div class="macro-icon">🥑</div><div class="macro-val" id="m-fat">0g</div><div class="macro-name">چەوی</div><div class="macro-bar-bg"><div class="macro-bar-fill" id="bar-fat" style="background:var(--green);width:0%"></div></div></div>
    </div>

    <div class="sec-title">💧 ئاو</div>
    <div class="water-card">
      <div class="water-header">
        <div class="wh-left"><span style="font-size:24px">💧</span><div><div class="wh-title">ئاو خواردراو</div><div class="wh-sub" id="water-target-txt">ئامانج: ٨ شیشە</div></div></div>
        <div class="water-count"><span id="water-num">0</span><span style="font-size:14px;color:var(--text2)"> شیشە</span></div>
      </div>
      <div class="water-glasses" id="water-glasses"></div>
    </div>

    <div class="sec-title">🌙 خەو</div>
    <div class="sleep-card">
      <div class="sleep-header"><div class="sleep-title">🌙 خەوی شەوی پێشتر</div><div class="sleep-badge" id="sleep-badge" style="background:var(--green-dim);color:var(--green)">باش</div></div>
      <div class="sleep-controls">
        <button class="sc-btn" onclick="adjSleep(-0.5)">−</button>
        <div class="sleep-val"><span id="sleep-val">7.5</span><span class="sleep-unit"> ساعەت</span></div>
        <button class="sc-btn" onclick="adjSleep(0.5)">+</button>
      </div>
      <div class="sleep-quality">
        <div class="sq-opt" data-q="bad"   onclick="selSleepQ('bad')">😴 خراپ</div>
        <div class="sq-opt" data-q="ok"    onclick="selSleepQ('ok')">😐 مامناوەند</div>
        <div class="sq-opt" data-q="good"  onclick="selSleepQ('good')">😊 باش</div>
        <div class="sq-opt" data-q="great" onclick="selSleepQ('great')">🌟 نایاب</div>
      </div>
    </div>

    <div class="sec-title">🏋️ وەرزشی ئیمڕۆ</div>
    <div class="workout-card">
      <div class="wc-badge" id="wt-type">—</div>
      <div class="wc-title" id="wt-title">—</div>
      <div class="wc-sub"   id="wt-muscles"></div>
      <div class="wc-stats">
        <div class="wc-stat"><span class="ws-icon">⏱️</span><div><div class="ws-text">ماوە</div><div class="ws-val" id="wt-dur">—</div></div></div>
        <div class="wc-stat"><span class="ws-icon">🔥</span><div><div class="ws-text">کالۆری</div><div class="ws-val" id="wt-cal">—</div></div></div>
        <div class="wc-stat"><span class="ws-icon">📊</span><div><div class="ws-text">ئاست</div><div class="ws-val" id="wt-level">—</div></div></div>
      </div>
      <button class="btn-start" onclick="window.location.href='vitamins.html?tab=workouts'">دەستپێکردنی وەرزش ←</button>
    </div>
  </div>

  <!-- BOTTOM NAV - 3 items only -->
  <nav class="bottom-nav">
    <a href="home.html"      class="nav-item active"><span class="nav-icon">🏠</span><span class="nav-label">ماڵ</span></a>
    <a href="nutrition.html" class="nav-item"><span class="nav-icon">🍽️</span><span class="nav-label">خۆراک</span></a>
    <a href="vitamins.html"  class="nav-item"><span class="nav-icon">💊</span><span class="nav-label">ڤیتامین</span></a>
  </nav>

  <script type="module">
    import { initializeApp }               from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    const app=initializeApp({apiKey:"AIzaSyBhYiFcQeB2r6CWDiFvqV0LUPNVoow1sjM",authDomain:"appmass-f26bd.firebaseapp.com",projectId:"appmass-f26bd",storageBucket:"appmass-f26bd.firebasestorage.app",messagingSenderId:"735578268323",appId:"1:735578268323:web:4f5e27ce1307db429bd516"});
    const auth=getAuth(app);
    const WORKOUTS=[
      {day:0,type:'ڕۆژی ئەستراحەت',title:'ئاسایش یان ماشقی سووک',muscles:'قەدەم هەڵکەوتن',dur:30,cal:150,level:'سووک'},
      {day:1,type:'Push Day',title:'سینە + مەڵبەند + تراسپس',muscles:'سینە، مەڵبەند، تراسپس',dur:60,cal:420,level:'مامناوەند'},
      {day:2,type:'Pull Day',title:'پشت + باسپس',muscles:'پشت، باسپس',dur:55,cal:390,level:'مامناوەند'},
      {day:3,type:'Leg Day',title:'لاق + ناوەند',muscles:'کوات، هامسترینگ، گلووت',dur:65,cal:480,level:'قورس'},
      {day:4,type:'Push Day',title:'سینە + مەڵبەند + تراسپس',muscles:'سینە، مەڵبەند',dur:60,cal:420,level:'مامناوەند'},
      {day:5,type:'Pull Day',title:'پشت + باسپس',muscles:'پشت، باسپس',dur:55,cal:390,level:'مامناوەند'},
      {day:6,type:'Full Body',title:'تەواوی جەستە + کاردیۆ',muscles:'هەموو ماسکەکان',dur:70,cal:520,level:'قورس'},
    ];
    onAuthStateChanged(auth,user=>{
      if(!user){window.location.href='index.html';return;}
      document.getElementById('loading-screen').style.display='none';
      checkReset(); loadUI(user);
    });
    function checkReset(){
      const ts=todayStr(),td=JSON.parse(localStorage.getItem('rkf_today')||'{}');
      if(td.date!==ts)localStorage.setItem('rkf_today',JSON.stringify({date:ts,water:0,sleep:7.5,sleepQ:'good',meals:[],workouts:[]}));
    }
    function loadUI(user){
      const prof=JSON.parse(localStorage.getItem('rkf_profile')||'{}');
      const today=JSON.parse(localStorage.getItem('rkf_today')||'{}');
      const goals=prof.goals||{calories:2000,protein:120,carbs:250,fat:60,water:8};
      const days=['یەکشەممە','دووشەممە','سێشەممە','چوارشەممە','پێنجشەممە','هەینی','شەممە'];
      const d=new Date();
      document.getElementById('today-date').textContent=days[d.getDay()]+' — '+d.toLocaleDateString('en-GB');
      document.getElementById('avatar-el').textContent=(user.displayName||'?')[0].toUpperCase();
      document.getElementById('streak-num').textContent=parseInt(localStorage.getItem('rkf_streak')||'0');
      const meals=today.meals||[];
      const consumed=meals.reduce((s,m)=>s+(m.calories||0),0);
      const burned=(today.workouts||[]).reduce((s,w)=>s+(w.cal||0),0);
      const left=Math.max(0,goals.calories-consumed+burned);
      document.getElementById('cal-consumed').textContent=consumed;
      document.getElementById('ci-goal').textContent=goals.calories;
      document.getElementById('ci-burned').textContent=burned;
      document.getElementById('ci-left').textContent=left+' cal';
      document.getElementById('cal-ring').style.strokeDashoffset=(2*Math.PI*45)*(1-Math.min(1,consumed/goals.calories));
      const tp=meals.reduce((s,m)=>s+(m.protein||0),0);
      const tc=meals.reduce((s,m)=>s+(m.carbs||0),0);
      const tf=meals.reduce((s,m)=>s+(m.fat||0),0);
      document.getElementById('m-protein').textContent=tp+'g';
      document.getElementById('m-carbs').textContent=tc+'g';
      document.getElementById('m-fat').textContent=tf+'g';
      document.getElementById('bar-protein').style.width=Math.min(100,(tp/goals.protein)*100)+'%';
      document.getElementById('bar-carbs').style.width=Math.min(100,(tc/goals.carbs)*100)+'%';
      document.getElementById('bar-fat').style.width=Math.min(100,(tf/goals.fat)*100)+'%';
      const wGoal=goals.water||8;
      document.getElementById('water-target-txt').textContent='ئامانج: '+wGoal+' شیشە';
      renderWater(today.water||0,wGoal);
      const sl=today.sleep||7.5;
      document.getElementById('sleep-val').textContent=sl;
      updateSleepBadge(sl);
      document.querySelectorAll('.sq-opt').forEach(el=>el.classList.toggle('selected',el.dataset.q===(today.sleepQ||'good')));
      const w=WORKOUTS[d.getDay()];
      document.getElementById('wt-type').textContent=w.type;
      document.getElementById('wt-title').textContent=w.title;
      document.getElementById('wt-muscles').textContent=w.muscles;
      document.getElementById('wt-dur').textContent=w.dur+' دق';
      document.getElementById('wt-cal').textContent=w.cal+' cal';
      document.getElementById('wt-level').textContent=w.level;
    }
    function renderWater(cur,total){
      document.getElementById('water-num').textContent=cur;
      const cont=document.getElementById('water-glasses');cont.innerHTML='';
      for(let i=0;i<total;i++){const g=document.createElement('div');g.className='glass'+(i<cur?' filled':'');g.innerHTML=i<cur?'💧':'🫙';g.onclick=()=>toggleWater(i,total);cont.appendChild(g);}
    }
    function toggleWater(idx,total){
      const td=JSON.parse(localStorage.getItem('rkf_today')||'{}');
      td.water=idx<(td.water||0)?idx:idx+1;
      localStorage.setItem('rkf_today',JSON.stringify(td));
      document.getElementById('water-num').textContent=td.water;
      renderWater(td.water,total);
    }
    window.adjSleep=d=>{const td=JSON.parse(localStorage.getItem('rkf_today')||'{}');let sl=Math.max(0,Math.min(24,parseFloat(td.sleep||7.5)+d));td.sleep=sl;localStorage.setItem('rkf_today',JSON.stringify(td));document.getElementById('sleep-val').textContent=sl;updateSleepBadge(sl);};
    function updateSleepBadge(h){const b=document.getElementById('sleep-badge');if(h>=8){b.style.background='var(--green-dim)';b.style.color='var(--green)';b.textContent='🌟 نایاب';}else if(h>=7){b.style.background='var(--blue-dim)';b.style.color='var(--blue)';b.textContent='😊 باش';}else if(h>=6){b.style.background='rgba(245,158,11,0.1)';b.style.color='var(--orange)';b.textContent='😐 مامناوەند';}else{b.style.background='rgba(239,68,68,0.1)';b.style.color='var(--red)';b.textContent='😴 کەم';}}
    window.selSleepQ=q=>{const td=JSON.parse(localStorage.getItem('rkf_today')||'{}');td.sleepQ=q;localStorage.setItem('rkf_today',JSON.stringify(td));document.querySelectorAll('.sq-opt').forEach(el=>el.classList.toggle('selected',el.dataset.q===q));};
    function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  </script>
</body>
</html>
